name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Install, build, and test live here, and this job has no id-token.
  # The release job below publishes tarballs this job packed. It does not
  # install this repository's dependencies. The tag-ancestry check below
  # still refuses an off-main tag before anything is packed. The scope of
  # that split is the publish token only: the tarballs are still built in
  # this job, where dependency install scripts run, so the split keeps those
  # scripts away from the token and does not by itself guarantee the
  # integrity of the built output.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scanner_version: ${{ steps.kind.outputs.scanner_version }}
      # Exactly "true" or "false", written by the decision step below, and
      # only after every condition in scripts/lib/release-kind.mjs held.
      #
      # Spelled POSITIVELY, and every condition that reads it is too: the
      # publish-side steps below run on "== 'false'", the smoke-published
      # job on "needs.release.outputs.action_only == 'false'" -- never
      # "!= 'true'". The difference only shows up when the value is
      # neither: an output that is empty or missing (a step renamed, an id
      # typo, a future edit that fails to set it) makes "!= 'true'" TRUE,
      # which would publish on a run that never decided anything. Both
      # spellings are equally readable and only one of them fails closed.
      action_only: ${{ steps.kind.outputs.action_only }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Runs before install, build, test and publish on purpose. This workflow
      # fires on any "v*" tag, and "git tag v9.9.9 <any-commit> && git push
      # --tags" fires it from any commit, on or off main. Without this check a
      # tag pushed at a commit off main would pack that commit, and the
      # release job would publish it, around branch protection, with a real
      # tag and a matching GitHub Release to show for it. The release job
      # grants id-token: write, so anyone who can push a tag could publish
      # arbitrary code under the package names.
      #
      # actions/checkout@v7 uses its default fetch-depth (1) above, so this
      # job's working copy holds only the tagged commit, with no history
      # connecting it to origin/main and no origin/main ref yet. Unshallow
      # first (only when the repo actually is shallow, since --unshallow on a
      # complete repo is a hard error), then fetch main by name into an
      # explicit local ref, since a tag-triggered checkout never sets one up.
      #
      # Ported from dep-guard's release.yml. Per the family release-discipline
      # rule this guard is first exercised on the next real tag push, so it is
      # placed early and cheaply where a disposable tag can prove it.
      - name: Assert the tagged commit is on main
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow origin
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. A tag pushed at a commit off main would otherwise walk straight into an OIDC trusted publish around branch protection. Refusing to publish."
            exit 1
          fi
          echo "Ancestry check passed: ${GITHUB_SHA} is on origin/main."

      # Runs before install, build, test and publish, right after the
      # ancestry check above: every mistake this catches is a human mistake
      # made at tag time -- a mistyped tag, a version left unbumped, a
      # forgotten CHANGELOG entry -- and none of it depends on anything
      # install, build or test produce. scripts/classify-release-tag.mjs
      # reads the four packages' package.json files via "node -p", talks to
      # the npm registry on the action-only path only, and uses node
      # builtins only (no dependency of this repository is installed yet,
      # and that script must keep it that way).
      #
      # Decides whether this tag is a PACKAGE release (the tag reads "v" +
      # the version every package carries) or an ACTION-ONLY release (the
      # tag moves past the scanner version and the packages stay where they
      # are: action.yml, README, CHANGELOG and docs moved, no package did).
      # Any other tag is refused outright. Ported from dep-guard by way of
      # vault-guard -- scripts/lib/release-kind.mjs holds the rules and the
      # reasoning for each; scripts/tests/release-kind.test.mjs holds the
      # cases, registry lookup and all, which is why this is a script
      # rather than more lines of bash here.
      #
      # This workflow only ever triggers on a "v*" tag push (see the "on:"
      # block above), so "${GITHUB_REF_NAME}" is always the tag and --tag is
      # never omitted here, unlike the sibling repositories' equivalent
      # step, which also has to cover a workflow_dispatch run with no tag.
      #
      # The script writes action_only and scanner_version to $GITHUB_OUTPUT
      # itself, so nothing here parses its stdout.
      - name: Decide the release kind, and refuse a tag that is neither
        id: kind
        run: |
          set -euo pipefail
          SCHEMA_NAME="$(node -p "require('./packages/schema/package.json').name")"
          SCHEMA_VERSION="$(node -p "require('./packages/schema/package.json').version")"
          CORE_NAME="$(node -p "require('./packages/core/package.json').name")"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          SKILL_NAME="$(node -p "require('./packages/skill/package.json').name")"
          SKILL_VERSION="$(node -p "require('./packages/skill/package.json').version")"
          CLI_NAME="$(node -p "require('./packages/cli/package.json').name")"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"

          node scripts/classify-release-tag.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --package "${SCHEMA_NAME}=${SCHEMA_VERSION}" \
            --package "${CORE_NAME}=${CORE_VERSION}" \
            --package "${SKILL_NAME}=${SKILL_VERSION}" \
            --package "${CLI_NAME}=${CLI_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md

          echo "Release kind decided: ref_name=${GITHUB_REF_NAME}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Portfolio name guard
        run: pnpm validate:portfolio-names

      - name: Test
        run: pnpm test

      - name: Release smoke
        run: pnpm release:smoke

      # pnpm pack rewrites workspace:* to a real range, the same rewrite
      # publish used to do. Packages are packed and later published in
      # dependency order: schema, core, skill, then the CLI. An action-only
      # tag packs nothing.
      #
      # "pnpm --dir", not "pnpm --filter": on pnpm 9, "--filter ... pack" in
      # a multi-package workspace exits 1 with "Unknown option:
      # 'recursive'". This repository floats pnpm 10, which accepts it, but
      # --dir is correct on both majors and matches the sibling gates. The
      # destination is absolute because with --dir a relative one resolves
      # under the package directory, not the repository root the upload step
      # reads.
      - name: Pack the publishable tarballs
        if: steps.kind.outputs.action_only == 'false'
        run: |
          set -euo pipefail
          mkdir -p pack-out/schema pack-out/core pack-out/skill pack-out/cli
          pnpm --dir packages/schema pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/schema"
          pnpm --dir packages/core pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/core"
          pnpm --dir packages/skill pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/skill"
          pnpm --dir packages/cli pack --pack-destination "${GITHUB_WORKSPACE}/pack-out/cli"

      # Each pack-out directory must hold exactly one tarball, and the
      # package.json inside it must carry the name and version of the
      # package it was packed from. A pack that silently produced nothing,
      # or packed the wrong package, stops here, before anything leaves
      # this job.
      - name: Check the packed tarballs match their packages
        if: steps.kind.outputs.action_only == 'false'
        run: |
          set -euo pipefail
          for dir in schema core skill cli; do
            shopt -s nullglob
            tarballs=(pack-out/"${dir}"/*.tgz)
            shopt -u nullglob
            if [[ "${#tarballs[@]}" -ne 1 ]]; then
              echo "::error::pack-out/${dir} holds ${#tarballs[@]} tarballs, expected exactly one."
              exit 1
            fi
            want="$(node -p "const p = require('./packages/${dir}/package.json'); p.name + '@' + p.version")"
            got="$(tar -xzOf "${tarballs[0]}" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")"
            if [[ "${got}" != "${want}" ]]; then
              echo "::error::pack-out/${dir} holds ${got}, expected ${want} from packages/${dir}/package.json."
              exit 1
            fi
            echo "pack-out/${dir}: ${got}"
          done

      - name: Upload the packed tarballs
        if: steps.kind.outputs.action_only == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-pack
          path: |
            pack-out/schema/*.tgz
            pack-out/core/*.tgz
            pack-out/skill/*.tgz
            pack-out/cli/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Trusted publishing stays on this job only. It downloads the tarballs
  # prepare packed and does not install this repository's dependencies.
  # npm CLI >= 11.5.1 is required for OIDC. Pin major 11: npm@12 needs a
  # newer Node than this job runs.
  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      action_only: ${{ needs.prepare.outputs.action_only }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        if: needs.prepare.outputs.action_only == 'false'
        run: npm install -g npm@11

      - name: Download the packed tarballs
        if: needs.prepare.outputs.action_only == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-pack
          path: pack-out

      # Skips any package whose exact version is already on the registry, so a
      # tag run stays green after a version was published by hand. That happens
      # on a first publish of a new package name: npm only exposes the
      # trusted-publisher setting on a package that already exists, so the very
      # first publish of a name cannot go through OIDC.
      #
      # Without the check, the first republish returns E403 and, because a run
      # block executes under bash -e, aborts the whole step. The job then fails
      # and both the GitHub Release step and the smoke-published job are
      # skipped, which is a misleading red for a release that is actually fine.
      #
      # The skip is per exact version, so it never hides a real publish failure
      # of a version that is genuinely new.
      #
      # Skipped entirely on an action-only release: the decision step already
      # proved every one of these packages is on the registry at this exact
      # version, so there is nothing new here to publish.
      # Order is schema, core, skill, then the CLI.
      - name: Publish to npm
        if: needs.prepare.outputs.action_only == 'false'
        run: |
          set -euo pipefail
          publish_one() {
            dir="$1"
            pack_dir="$2"
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            published="$(npm view "$name@$version" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "SKIP: $name@$version is already on the registry"
              return 0
            fi
            echo "PUBLISH: $name@$version"
            tarball="$(find "${pack_dir}" -name '*.tgz' -print)"
            test -n "${tarball}"
            # A leading ./ is always a local file spec to npm; a bare dir/file.tgz
            # with one slash is read as the GitHub shorthand owner/repo.
            npm publish "./${tarball}" --access public
          }
          publish_one packages/schema pack-out/schema
          publish_one packages/core pack-out/core
          publish_one packages/skill pack-out/skill
          publish_one packages/cli pack-out/cli

      # Two Release steps, one per release kind, rather than one step with a
      # computed body. The body is the only difference between them, and it
      # is the part that must not be wrong: "Published ... to npm" appears
      # under exactly one condition, the same condition that let the
      # publish step run at all, so an action-only release cannot announce
      # a publish that did not happen.
      - name: Create GitHub Release
        if: needs.prepare.outputs.action_only == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published @vaultcompass/intent-guard packages to npm.
            See CHANGELOG.md on main.

      # The action-only body. It has to answer the question a reader of
      # this Release page actually has: the tag moved, so what am I getting?
      # That answer is a scanner version that did not move with it.
      - name: Create GitHub Release (action-only)
        if: needs.prepare.outputs.action_only == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Action-only release. This tag moves the composite action; the scanner it installs stays at `${{ needs.prepare.outputs.scanner_version }}`, which was already on npm before this tag.

            Nothing was published to npm by this release.

            See CHANGELOG.md for what changed.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    # Nothing was published on an action-only release, so there is nothing
    # here to smoke test: every command below installs
    # @vaultcompass/intent-guard at the version named by the tag, and on an
    # action-only tag that version does not exist on the registry and never
    # will. The job would wait out its polling loop and then fail a release
    # that did exactly what it was supposed to.
    if: needs.release.outputs.action_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install published CLI and run init
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Smoke testing @vaultcompass/intent-guard@${VERSION}"

          # The CLI depends on the other three at an exact version, so the
          # install below fails until every one of them is visible. Waiting on
          # the CLI alone is what failed the v1.2.1 run: schema and skill were
          # visible inside a minute, core took about six minutes, and npm hit
          # ETARGET one second after the CLI appeared. Wait for all four, and
          # leave the registry room to be slow.
          PACKAGES="@vaultcompass/intent-guard-schema @vaultcompass/intent-guard-core @vaultcompass/intent-guard-skill @vaultcompass/intent-guard"
          FOUND=0
          MISSING=""
          for i in $(seq 1 60); do
            MISSING=""
            for pkg in ${PACKAGES}; do
              if [[ "$(npm view "${pkg}@${VERSION}" version 2>/dev/null)" != "${VERSION}" ]]; then
                MISSING="${MISSING} ${pkg}"
              fi
            done
            if [[ -z "${MISSING}" ]]; then
              echo "All four packages visible on registry."
              FOUND=1
              break
            fi
            echo "Waiting for npm registry (attempt ${i}/60), still missing:${MISSING}"
            sleep 10
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out waiting at ${VERSION} for:${MISSING}"
            exit 1
          fi

          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/intent-guard@${VERSION}"
          ./node_modules/.bin/intent-guard --version
          ./node_modules/.bin/intent-guard init --project .
          test -f .intent-guard/config.yaml
          echo "Release smoke passed."
