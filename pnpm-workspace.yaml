packages:
  - "packages/*"

# Overrides live here rather than under a "pnpm" key in package.json. pnpm
# 11 reads settings only from this file, and a lockfile regenerated by a pnpm
# that ignores the package.json key silently drops every override: Dependabot
# did exactly that, which put fast-uri and esbuild back on vulnerable versions
# and failed every frozen install with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
# pnpm 10 reads this file too.
overrides:
  esbuild: "^0.28.1"
  fast-uri: "^4.2.3"
  nanoid: "^3.3.18"
  postcss: ">=8.5.18"
  # vitest 4 accepts vite 6, 7 or 8 and pnpm keeps whatever it already
  # resolved, so without this floor the lockfile stays on a vulnerable 7.3.x.
  vite: "^7.3.7"
