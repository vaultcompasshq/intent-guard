name: Intent Guard
description: Gate a pull request against its frozen intent contract, read from the base ref. Run after actions/checkout.
author: Vault & Compass LLC
branding:
  icon: shield
  color: purple

# There is no SARIF here, and this action deliberately does not upload anything
# to code scanning. intent-guard reports a single verdict about a change set
# rather than per-file findings with locations, so a SARIF log would carry one
# result pinned to no line, and the GitHub security tab would show an alert that
# never resolves. The verdict shows in the job log, and the job's own pass or
# fail is the signal a branch-protection rule reads. `json-output` is for a
# workflow that wants to post the verdict somewhere itself.

inputs:
  version:
    description: |
      The exact version of `@vaultcompass/intent-guard` to install, such as
      `1.5.0`. Validated against `^[0-9]+\.[0-9]+\.[0-9]+$`, and the default is
      the version this action shipped with.

      Nothing else is accepted, and the two families refused are refused for
      different reasons. A dist-tag such as `latest` means the program judging a
      pull request is whichever one the registry served that morning rather than
      one decided in the workflow file. A value beginning with a dot, or ending
      in `.tgz`, is not a version at all: npm reads it as a PATH, which on a run
      that starts in a checkout would let the tree being judged hand over its
      own gate.

      A PRERELEASE CANNOT BE PINNED HERE. `1.6.0-rc.1` does not match, so a
      release candidate cannot be gated through this action before it ships.
      That is deliberate and matches the conductor action: the version that
      judges a pull request is a released one, and the pattern stays the
      narrowest one that names a release. Run a candidate through the CLI
      directly.
    required: false
    default: 1.5.0
  project:
    description: |
      Path to the Intent Guard project root, relative to the workspace root.
      Must be 1..256 characters of `[A-Za-z0-9._/-]`, must not contain `..`, and
      must not begin with `-`, so it can neither escape GITHUB_WORKSPACE nor be
      read as an option by a command it reaches. (The charset is checked with
      `+` plus a separate length guard, never `{1,256}`: BSD regex sets
      RE_DUP_MAX to 255, so `{1,256}` fails to compile on macOS and rejects
      every path including `.`.)

      Passed to intent-guard as an ABSOLUTE path, built from GITHUB_WORKSPACE,
      because the step that runs the gate runs from the runner temp rather than
      from the checkout.
    required: false
    default: .
  base:
    description: |
      Git ref the changed paths are measured against. intent-guard judges the
      paths changed since the merge base with this ref.

      Left at the default, this is decided by the event: on a `pull_request`
      event the action passes `origin/$GITHUB_BASE_REF`. On any other event
      there is nothing to decide it, so `base` or `paths` has to be set and the
      action refuses the run otherwise. That refusal is deliberate: the gate
      fails closed on an empty path set, so a push run with no paths would pass
      every time, for the wrong reason.

      Setting this does NOT give the run a trust base. It decides which paths
      are judged, never where the rules are read from, and the action warns when
      a run ends up with one and not the other.

      Same charset rules as `project`.
    required: false
    default: ''
  paths:
    description: |
      Explicit changed paths, comma separated, instead of or in addition to
      `base`. Each element has the same rules as `project`, and the value as a
      whole may not contain a newline: it is one comma-separated list, and a
      line break in it is refused rather than read as another separator.
    required: false
    default: ''
  trust-base:
    description: |
      Pull-request mode. intent-guard reads every control input (the frozen
      contract, `config.yaml`, and the contracts archive) from this git ref
      instead of from the tree it is judging, so a pull request cannot widen
      its own contract, delete its protected paths, or write its own approval
      in the same commit that carries what the gate exists to catch. A
      head-side change to any of them is reported as a proposal and ignored.

      Left at the default, this is decided by the event: on a `pull_request`
      event the action passes `origin/$GITHUB_BASE_REF`, and on any other event
      it passes nothing and behaviour is unchanged. Set it to a ref to point
      pull-request mode at a different base.

      There is deliberately NO value that turns pull-request mode off, and
      `off` is refused with an error rather than ignored, in any capitalisation.
      On a same-repository `pull_request` event the workflow file runs from the
      pull request's own head, so an opt-out input would be settable by the very
      pull request whose control inputs it governs, which is the switch this
      mode exists to take away. Base-ref judging is the floor, not a knob.

      A pull_request run using this REQUIRES `actions/checkout` with
      `fetch-depth: 0`, so the base branch is present to read. Without it
      intent-guard exits 2 and the job fails, which is deliberate: a missing
      base is never a reason to fall back to trusting the head.

      Same charset rules as `project`.
    required: false
    default: ''
  require-frozen:
    description: |
      Set to `false` to let a project without a frozen contract pass instead of
      blocking. Closed enum: `true` or `false`. The default is `true`, which is
      the enforcing shape: no frozen contract means nothing has been approved,
      and passing that is how a repository ends up with a gate that never
      blocks anything.
    required: false
    default: 'true'
  json-output:
    description: |
      Where to write intent-guard's JSON result, relative to the workspace
      root. Same path rules as `project`, and additionally may not be under
      `.github/`, which holds the workflow file and the CODEOWNERS entry that
      decide how this gate runs. Left empty, the action runs in text mode so
      the verdict and its reasons are readable in the job log; set it and stdout
      is JSON, redirected into this file and exposed as the `result-file`
      output for a later step to read.

      `result-file` is published only when that file exists and is non-empty. A
      gate that exited before writing anything leaves the output empty rather
      than pointing a later step at a file with no JSON in it.
    required: false
    default: ''

outputs:
  exit-code:
    description: >-
      intent-guard's own exit code (0 pass, 1 blocked, 2 could not run), or the
      shell's if the binary never ran. EMPTY when the run step never reached its
      output lines at all, which is what an input that failed validation or an
      install that failed looks like from here; the job still fails, because the
      report step treats an empty code as could-not-run and exits 2. A caller
      branching on this output has four cases to handle, not three.
    value: ${{ steps.run.outputs.exit_code }}
  result-file:
    description: Absolute path to the written JSON file, empty when json-output was not set or no JSON was written
    value: ${{ steps.run.outputs.result_file }}

runs:
  using: composite
  steps:
    # Consumers must run actions/checkout on their repository BEFORE this
    # action, with fetch-depth: 0 on a pull_request run so the base ref is
    # present for both --base and --trust-base to resolve.

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    # Every input is validated before it can reach a shell.
    #
    # The reason this is a step of its own rather than inline guards in the
    # run script: GitHub substitutes `${{ inputs.* }}` into the script text
    # BEFORE the shell ever parses it, so no amount of quoting in the script
    # body can contain a hostile value. Values are passed through `env:`
    # instead, which the shell expands at runtime, and validated there.
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        IG_VERSION: ${{ inputs.version }}
        IG_PROJECT: ${{ inputs.project }}
        IG_BASE: ${{ inputs.base }}
        IG_PATHS: ${{ inputs.paths }}
        IG_TRUST_BASE: ${{ inputs.trust-base }}
        IG_REQUIRE_FROZEN: ${{ inputs.require-frozen }}
        IG_JSON_OUTPUT: ${{ inputs.json-output }}
      run: |
        set -euo pipefail

        # EXACT VERSIONS ONLY. Not a range, not a dist-tag, not `latest`, and
        # the two things that refusal buys are different.
        #
        # A tag hands the choice of program to the registry on the morning of
        # the run, so the version that judges a pull request stops being a
        # decision written down in the workflow file.
        #
        # The other one is sharper. npm's specifier parser reads
        # `@scope/name@<value>` as a PATH, not a version, when the value begins
        # with a dot or ends in `.tgz`: `.`, `..` and `payload.tgz` all resolve
        # against a directory rather than the registry. A charset that let those
        # through would be one committed file away from the tree under judgment
        # choosing its own gate.
        if [[ ! "${IG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          printf '::error::intent-guard: the `version` input must be an exact version like 1.5.0, and was %q\n' "${IG_VERSION}"
          printf '::error::A dist-tag such as latest, a range, or anything else is refused. A value beginning with a dot or ending in .tgz is read by npm as a path rather than a version.\n'
          exit 1
        fi

        case "${IG_REQUIRE_FROZEN}" in
          true|false) ;;
          *)
            printf '::error::intent-guard: invalid `require-frozen` input: %q\n' "${IG_REQUIRE_FROZEN}"
            printf '::error::Allowed: true | false\n'
            exit 1
            ;;
        esac

        # project / json-output / base / trust-base / each element of paths:
        # relative, inside the workspace. No `..` segments, no leading `/`, no
        # leading `-`.
        #
        # The charset check uses `+` and a separate length guard, NOT
        # `{1,256}`: macOS bash uses a BSD regex engine with RE_DUP_MAX 255,
        # where `{1,256}` fails to compile and the match then rejects every
        # value, including the default `.`.
        validate_path() {
          local name="$1"
          local value="$2"
          if [[ ! "${value}" =~ ^[A-Za-z0-9._/-]+$ ]] || (( ${#value} > 256 )); then
            printf '::error::intent-guard: invalid `%s` input: %q\n' "${name}" "${value}"
            printf '::error::Allowed: 1..256 chars of [A-Za-z0-9._/-]\n'
            exit 1
          fi
          if [[ "${value}" == *".."* ]]; then
            printf '::error::intent-guard: `%s` must not contain `..`: %q\n' "${name}" "${value}"
            exit 1
          fi
          if [[ "${value}" == /* ]]; then
            printf '::error::intent-guard: `%s` must be relative to the workspace: %q\n' "${name}" "${value}"
            exit 1
          fi
          # The leading-dash rule is not about escaping the workspace, and it
          # applies to every value rather than only to the refs: a path or a
          # ref beginning with `-` is read as an OPTION by whichever command
          # intent-guard hands it to. Caught here, where the message can name
          # the workflow input that produced it, which git cannot.
          if [[ "${value}" == -* ]]; then
            printf '::error::intent-guard: `%s` must not begin with a dash: %q\n' "${name}" "${value}"
            exit 1
          fi
        }

        validate_path "project" "${IG_PROJECT}"

        if [[ -n "${IG_JSON_OUTPUT}" ]]; then
          validate_path "json-output" "${IG_JSON_OUTPUT}"
          # `.github/` holds the workflow file and the CODEOWNERS entry that
          # decide how this gate runs and who is allowed to change it. A
          # result written there is one upload, commit or artifact step away
          # from landing inside the path a reviewer is protecting.
          if [[ "${IG_JSON_OUTPUT}" == ".github" || "${IG_JSON_OUTPUT}" == ".github/"* ]]; then
            printf '::error::intent-guard: `json-output` must not write under .github/: %q\n' "${IG_JSON_OUTPUT}"
            printf '::error::That directory holds the workflow file and the CODEOWNERS entry that decide how this gate runs. Write the result somewhere else and read it from there.\n'
            exit 1
          fi
        fi

        # Each element separately rather than the joined string: a single
        # check with `,` added to the charset would accept `a,/etc/passwd`,
        # because the leading-slash rule would only ever see the first
        # character of the whole value.
        if [[ -n "${IG_PATHS}" ]]; then
          # A newline is refused before the split rather than treated as
          # another separator. `read` stops at the first newline, so a
          # two-line value used to have its first line validated element by
          # element, its second line validated by nothing at all, and then the
          # whole value passed to intent-guard. One list syntax, and it is
          # commas.
          if [[ "${IG_PATHS}" == *$'\n'* ]]; then
            printf '::error::intent-guard: `paths` must not contain a newline. It is one comma-separated list: %q\n' "${IG_PATHS}"
            exit 1
          fi
          IFS=',' read -r -a IG_PATHS_LIST <<< "${IG_PATHS}"
          for element in "${IG_PATHS_LIST[@]}"; do
            validate_path "paths" "${element}"
          done
        fi

        # There is no opt-out value, and `off` is refused BY NAME rather than
        # left to fail the charset check with a confusing message. Matched in
        # any capitalisation, because a value refused as `off` and accepted as
        # `Off` would be an opt-out with a shift key in front of it: git would
        # then be asked for a ref named Off, fail to resolve it, and the run
        # would exit 2 for a reason nobody could read.
        #
        # The reason for refusing at all is the same reason the mode exists: on
        # a same-repository `pull_request` event the workflow file runs from the
        # pull request's own head, so the pull request whose contract and config
        # are being held at arm's length could add `trust-base: off` to the
        # workflow in the very commit being judged, and the boundary would be
        # back to being a setting the untrusted side controls. Refusing loudly
        # is what keeps someone from quietly re-adding it.
        case "${IG_TRUST_BASE}" in
          [Oo][Ff][Ff])
            printf '::error::intent-guard: `trust-base: off` is not supported. Pull-request mode is not optional: on a same-repository pull_request event the workflow file runs from the pull request head, so an opt-out input would be settable by the pull request it governs.\n'
            exit 1
            ;;
        esac

        # base and trust-base are git refs, not paths, but the same charset
        # serves: a ref is letters, digits, dots, dashes, underscores and
        # slashes. Empty means "decide from the event", so neither is
        # validated as a ref when it is empty.
        if [[ -n "${IG_BASE}" ]]; then
          validate_path "base" "${IG_BASE}"
        fi
        if [[ -n "${IG_TRUST_BASE}" ]]; then
          validate_path "trust-base" "${IG_TRUST_BASE}"
        fi

        # Off a pull request there is no ref for the action to fall back to,
        # and the gate fails closed on an empty path set: a run that named
        # neither would hand intent-guard nothing to judge, and nothing to
        # judge passes. Refused here rather than left to look like a clean
        # run. GITHUB_BASE_REF is the variable the run step actually falls
        # back to, so it is the one checked, and Actions defines it EMPTY
        # outside a pull request rather than leaving it unset.
        if [[ -z "${IG_BASE}" && -z "${IG_PATHS}" && -z "${GITHUB_BASE_REF:-}" ]]; then
          printf '::error::intent-guard: this run is not a pull_request event, so the action has no base ref to fall back to. Set the `base` input to a git ref, or the `paths` input to the paths to judge.\n'
          printf '::error::The gate fails closed on an empty path set, so there is no safe default here: a run with no paths would pass every time.\n'
          exit 1
        fi

    # THE PROGRAM COMES FROM OUTSIDE THE TREE IT JUDGES. Running the gate with
    # `npx` from inside the checkout put the whole choice of program inside the
    # tree under judgment, by two separate routes. A `.npmrc` committed by the
    # head repoints the registry npx fetches from. A
    # `node_modules/@vaultcompass/intent-guard` already present in the head,
    # from the workflow's own earlier install step, is what npx runs, with the
    # version pin acting only as a satisfaction check on a package the head
    # wrote. Now the package is installed from the registry at the version
    # pinned in the caller's workflow file, under a prefix in the runner temp,
    # and invoked from there by absolute path.
    #
    # WHAT THAT PIN DOES AND DOES NOT PROTECT. It takes the choice of program
    # out of the tree: the head's lockfile, manifest, node_modules and .npmrc no
    # longer decide what runs. It does not take that choice out of the workflow
    # file. On a pull_request event GitHub runs the workflow as it is in the
    # pull request's merge commit, so a pull request that edits the workflow can
    # change this pin, or delete the step outright, the same as it could rewrite
    # any other CI step; only pull_request_target runs the base branch's copy,
    # and that event carries the base's secrets and is the wrong one for judging
    # untrusted code. The control for a workflow edit is branch protection on
    # the base branch, with review required for the workflow path, and nothing
    # this action does can substitute for it. The boundary here is against the
    # TREE choosing its own judge.
    #
    # IT RUNS OUTSIDE THE CHECKOUT TOO, not just installs outside it. A
    # composite step with no working-directory runs at the workspace root, which
    # is the head's own tree: npm would then be started with the pull request's
    # .npmrc, package.json and lockfile under its cwd. In global mode npm does
    # not read a project's own configuration, so nothing here is known to depend
    # on that, and that is exactly why the step should not rest on it: the
    # reason it is safe would be a property of a version of npm rather than of
    # this file. Running from the runner temp costs nothing and takes the
    # question away.
    - name: Install intent-guard outside the workspace
      id: install
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # Under the runner temp, which is outside the workspace and is cleaned
        # up by the runner. npm reads this variable itself, so nothing here has
        # to pass --prefix on a command line.
        npm_config_prefix: ${{ runner.temp }}/intent-guard-action
        IG_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        mkdir -p "${npm_config_prefix}"
        npm install -g "@vaultcompass/intent-guard@${IG_VERSION}"

    - name: Run intent-guard
      id: run
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # The binary the install step just wrote, by absolute path rather than
        # by name. A bare name would be resolved against PATH, and a workflow
        # that put its own node_modules/.bin on PATH before this action would
        # hand the head's copy back the resolution the install step took away.
        #
        # THE LAYOUT ASSUMED HERE IS THE LINUX AND MACOS ONE, where a global
        # install puts its shims in <prefix>/bin. On Windows npm puts them in
        # the prefix directory itself, and this path would not exist.
        IG_BIN: ${{ runner.temp }}/intent-guard-action/bin/intent-guard
        IG_PROJECT: ${{ inputs.project }}
        IG_BASE: ${{ inputs.base }}
        IG_PATHS: ${{ inputs.paths }}
        IG_TRUST_BASE: ${{ inputs.trust-base }}
        IG_REQUIRE_FROZEN: ${{ inputs.require-frozen }}
        IG_JSON_OUTPUT: ${{ inputs.json-output }}
      run: |
        # NOT `set -euo pipefail`. GitHub invokes a composite bash step as
        # `bash --noprofile --norc -eo pipefail {0}`, so errexit is ALREADY ON
        # before this script's first line. A `set` line here would re-state
        # that and clear nothing, and the shell would abort at the gate the
        # moment intent-guard exited non-zero, which is the entire interesting
        # case: GITHUB_OUTPUT would stay empty and the report step below would
        # have no code to re-raise. Errexit is cleared narrowly, around the one
        # command that is EXPECTED to exit non-zero, and restored immediately
        # afterwards, so every other line in this script still fails the step
        # if it breaks.

        ROOT="${GITHUB_WORKSPACE}"
        OUT=""
        RESULT_FILE=""

        # ABSOLUTE, built from the workspace. This step runs from the runner
        # temp rather than from the checkout, so a relative project root would
        # resolve against the wrong directory. intent-guard hands the project
        # root to git as its cwd, so an absolute one works everywhere the
        # relative one did.
        ARGS=(check --project "${ROOT}/${IG_PROJECT}")

        # --base decides which paths are judged. GITHUB_BASE_REF is set by
        # GitHub on, and only on, a pull_request event, which is exactly the
        # run where the tree being judged was written by someone who is not
        # yet trusted, so the event decides the default and no workflow has to
        # remember to.
        #
        # origin/ prefixed, not bare: GITHUB_BASE_REF is a branch NAME
        # ("main"), and after actions/checkout only the remote-tracking ref
        # exists locally. A bare "main" would resolve to nothing on a
        # detached-HEAD checkout and intent-guard would exit 2, which is safe
        # but for the wrong reason.
        if [[ -n "${IG_BASE}" ]]; then
          ARGS+=(--base "${IG_BASE}")
        elif [[ -n "${GITHUB_BASE_REF:-}" ]]; then
          ARGS+=(--base "origin/${GITHUB_BASE_REF}")
        fi

        # --trust-base decides WHERE THE RULES COME FROM, which is a different
        # question from which paths are judged, so it is built separately even
        # though both usually resolve to the same ref.
        #
        # There is no opt-out branch here on purpose: an explicit ref
        # REDIRECTS pull-request mode, it never disables it, and the validate
        # step refuses `off` before this line is reached.
        if [[ -n "${IG_TRUST_BASE}" ]]; then
          ARGS+=(--trust-base "${IG_TRUST_BASE}")
        elif [[ -n "${GITHUB_BASE_REF:-}" ]]; then
          ARGS+=(--trust-base "origin/${GITHUB_BASE_REF}")
        else
          # Reached only when the validate step was satisfied by `base` or
          # `paths` off a pull request. Those decide which paths are judged and
          # say nothing about where the rules come from, so this run reads the
          # contract, config.yaml and the contracts archive out of the very
          # tree it is judging. That is a warning rather than a refusal because
          # a push run on a protected branch is a legitimate place to be, but
          # merge_group and pull_request_review are not: both carry a base ref
          # in the event payload that GITHUB_BASE_REF does not expose, and a
          # caller who lands here on one of them wanted a trust base and did
          # not get one.
          printf '::warning::intent-guard: this run has no trust base, so the contract, config.yaml and the contracts archive are read from the tree being judged. The `base` input decides which paths are judged, never where the rules come from. On a merge_group or pull_request_review event, set the `trust-base` input to the base ref.\n'
        fi

        # Passed as the one comma-separated value intent-guard's own --paths
        # takes, not split here: the CLI splits it, and splitting it twice
        # would turn a path list into positional arguments.
        if [[ -n "${IG_PATHS}" ]]; then
          ARGS+=(--paths "${IG_PATHS}")
        fi

        if [[ "${IG_REQUIRE_FROZEN}" == "false" ]]; then
          ARGS+=(--no-require-frozen)
        fi

        if [[ -n "${IG_JSON_OUTPUT}" ]]; then
          OUT="${ROOT}/${IG_JSON_OUTPUT}"
          mkdir -p "$(dirname "${OUT}")"
          ARGS+=(--json)
        fi

        # Two calls rather than one with a computed redirect: in text mode the
        # verdict and its reasons belong in the job log, where the person
        # reading the failed check will look, and a redirect into a file would
        # take them out of it. In JSON mode the JSON is the whole of stdout,
        # so this redirects rather than tees: a tee of a text banner into a
        # JSON file is how a sibling action in this family broke its own
        # output.
        set +e
        if [[ -n "${OUT}" ]]; then
          "${IG_BIN}" "${ARGS[@]}" > "${OUT}"
        else
          "${IG_BIN}" "${ARGS[@]}"
        fi
        CHECK_STATUS=$?
        set -e

        # Published only when there is something in it. A gate that exited
        # before writing leaves the redirect target created and empty, and an
        # output pointing at an empty file is worse than an empty output: the
        # step that reads it reports a parse error instead of the fact that
        # intent-guard never ran.
        if [[ -n "${OUT}" ]]; then
          if [[ -s "${OUT}" ]]; then
            RESULT_FILE="${OUT}"
          else
            printf 'intent-guard: no JSON was written to %s (the gate exited %s first), so the result-file output is empty.\n' "${OUT}" "${CHECK_STATUS}"
          fi
        fi

        echo "exit_code=${CHECK_STATUS}" >> "${GITHUB_OUTPUT}"
        echo "result_file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"

        # Deliberately exits 0 here, whatever intent-guard said. The real
        # exit code is re-raised in the last step, which runs with always() so
        # a caller can put its own steps in between and still have them run.
        exit 0

    # The gate, re-raised in a step of its own. Passes intent-guard's own exit
    # code through rather than collapsing every non-zero to 1: 2 means
    # intent-guard could not run its checks at all, which is a different fact
    # from "the change is blocked" and must not be reported as one. This is
    # the same rule the generated pre-commit hook follows.
    #
    # Only 0 and 1 are verdicts. Everything else, including the codes the SHELL
    # produces when the binary is missing or not executable, is could-not-run
    # and is re-raised as 2, so a required check still fails and the message
    # says why rather than claiming the change was blocked.
    - name: Report intent-guard result
      id: report
      if: ${{ always() }}
      shell: bash
      env:
        IG_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        IG_RESULT_FILE: ${{ steps.run.outputs.result_file }}
      run: |
        set -uo pipefail

        # Where the reader should look, which is not the same place in the two
        # modes. In JSON mode stdout was redirected into the file, so the run
        # step log holds nothing to read and pointing at it would send someone
        # to an empty page.
        if [[ -n "${IG_RESULT_FILE}" ]]; then
          WHERE="the JSON result at ${IG_RESULT_FILE}"
        else
          WHERE="the run step log"
        fi

        # Empty means the run step never got far enough to record a code: an
        # input failed validation, or the step itself died. That is not a clean
        # run and it is not a verdict either, so it re-raises 2 with the other
        # could-not-run cases rather than passing through a bare `exit ""`,
        # which bash rejects as a bad argument and which would then exit 1 for
        # a reason that has nothing to do with the gate.
        if [[ -z "${IG_EXIT_CODE}" ]]; then
          printf '::error::intent-guard did not run to completion, so no result was recorded and there is no verdict. An input failed validation, or a step died before the gate ran. See the earlier steps.\n'
          exit 2
        fi

        case "${IG_EXIT_CODE}" in
          0)
            echo "intent-guard: gate ok."
            exit 0
            ;;
          1)
            printf '::error::intent-guard blocked this change (exit 1). See the verdict in %s.\n' "${WHERE}"
            exit 1
            ;;
          2)
            printf '::error::intent-guard could not complete its checks (exit 2): an unresolvable ref, a missing merge base, or a trust base that will not resolve. This is not a passing gate.\n'
            exit 2
            ;;
          *)
            printf '::error::intent-guard did not produce a verdict: the run step exited %s, which is not one of the three codes intent-guard itself uses. npm or the intent-guard binary failed to run, so nothing judged this change. Reported as could not run.\n' "${IG_EXIT_CODE}"
            exit 2
            ;;
        esac
